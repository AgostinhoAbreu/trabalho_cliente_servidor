<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Arquivos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    
    <!-- menu lateral -->
    <div class="sidebar">
      <h2>Meus Arquivos</h2>
      <button id="btn-novo">+ Novo Arquivo</button>
      
      <ul id="lista-arquivos">
      </ul>
    </div>

    <!-- area de edicao -->
    <div class="main">
      <div class="header-editor">
        <input type="text" id="nome-arquivo" placeholder="Nome do arquivo (ex: teste.txt)">
        <span id="status-modo">Modo: Novo</span>
      </div>

      <textarea id="conteudo-arquivo" placeholder="Escreva o conteudo do arquivo aqui..."></textarea>

      <div class="botoes">
        <button id="btn-salvar">Salvar Arquivo</button>
        <button id="btn-excluir" class="btn-perigo" style="display: none;">Excluir Arquivo</button>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
